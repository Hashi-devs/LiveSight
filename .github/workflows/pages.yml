name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (gets three.js)
        run: npm install --no-audit --no-fund

      - name: Assemble the site
        run: |
          mkdir -p _site/vendor
          cp -r client _site/client
          cp -r shared _site/shared
          cp -r assets _site/assets
          cp node_modules/three/build/three.module.js _site/vendor/
          cp node_modules/three/build/three.core.js _site/vendor/ 2>/dev/null || true
          mkdir -p _site/vendor/fonts
          cp node_modules/@fontsource/barlow-semi-condensed/files/barlow-semi-condensed-latin-*-normal.woff2 _site/vendor/fonts/
          ls _site/vendor/fonts
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
